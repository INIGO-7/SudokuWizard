name: install-test

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel and install it the way a user would
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Solve a sample sudoku
        shell: bash
        run: |
          cd "$RUNNER_TEMP"   # test the installed package, not the source tree
          sudokuwizard "$GITHUB_WORKSPACE/SudokuWizard/res/photos/sudoku/sudokuLibro3.jpeg" --no-show -o solved.png
          test -s solved.png
